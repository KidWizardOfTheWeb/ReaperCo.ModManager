name: Build for windows

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt # Pyinstaller is already here, so it should get installed

      - name: Build with pyinstaller
        run: |
          # NOTE: on windows, we build with specific flags and our home-grown .spec file
          pyinstaller ReaperCoModManager.spec

      - name: Upload new release to github
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
